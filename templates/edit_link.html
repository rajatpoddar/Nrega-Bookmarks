{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-12 max-w-2xl">
    
    <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tight flex items-center gap-3">
                <i class="fa-solid fa-pen-to-square text-nregagreen"></i> Edit Bookmark
            </h1>
        </div>
        <a href="/admin" class="glass-card px-4 py-2 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-white/10 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Admin
        </a>
    </div>

    <div class="glass-card p-8 rounded-2xl border border-white/5">
        <form action="/admin/update_link/{{ link.id }}" method="POST" class="space-y-5">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Link Title</label>
                    <input type="text" name="title" value="{{ link.title }}" required class="w-full bg-slate-800/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-nregagreen transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Icon Class</label>
                    <input type="text" name="icon_class" value="{{ link.icon_class }}" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-nregagreen transition">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">URL or Template</label>
                <input type="text" name="url" value="{{ link.url }}" required class="w-full bg-slate-800/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-nregagreen transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Select Category</label>
                <select name="category_id" required class="w-full bg-slate-800/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-nregagreen transition">
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == link.category_id %}selected{% endif %}>
                            {{ cat.name }} {% if cat.is_application %}(App){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-center gap-2 mt-4 bg-yellow-500/10 p-4 rounded-xl border border-yellow-500/20">
                <input type="checkbox" name="is_dynamic" id="is_dynamic" {% if link.is_dynamic %}checked{% endif %} class="w-4 h-4 accent-yellow-500 bg-slate-800 border-slate-600 rounded">
                <label for="is_dynamic" class="text-sm text-yellow-500/90 cursor-pointer font-medium">This is a Dynamic Link (Requires District/Block codes)</label>
            </div>

            <button type="submit" class="w-full bg-nregagreen hover:bg-emerald-600 text-white font-semibold rounded-lg px-4 py-3 mt-6 transition shadow-lg shadow-nregagreen/20">
                Update Link
            </button>
        </form>
    </div>

</div>
{% endblock %}
