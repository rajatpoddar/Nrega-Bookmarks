<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>NREGA Bookmarks Dashboard | Quick Access to MGNREGA Portals</title>
    <meta name="title" content="NREGA Bookmarks Dashboard | Quick Access to MGNREGA Portals">
    <meta name="description" content="A centralized, dynamic bookmarking dashboard for NREGA workers, POs, and officials. Get instant access to FTOs, Muster Rolls, and reports.">
    <meta name="keywords" content="NREGA, MGNREGA, NREGA Bookmarks, NREGA Portal, FTO Report, Muster Roll, Jharkhand NREGA, NREGA Dashboard, NregaBot">
    <meta name="author" content="Rajat Poddar">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bookmark.nregabot.com/">
    <meta property="og:title" content="NREGA Bookmarks Dashboard">
    <meta property="og:description" content="Quick and dynamic access to all MGNREGA portals and reports. Select your district and block to auto-generate links.">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7555042175718049" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    
    <script>
        const savedTheme = localStorage.getItem('userTheme') || 'theme-slate';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* THEME VARIABLES - Firefox 48+ supports this natively */
        :root, [data-theme="theme-slate"] {
            --color-bg: #0f172a; 
            --color-cardbg: rgba(255, 255, 255, 0.03);
            --color-cardborder: rgba(255, 255, 255, 0.05);
            --color-accent: #10b981; 
            --text-main: #ffffff;
            --bg-pattern: radial-gradient(rgba(255, 255, 255, 0.03) 1.5px, transparent 1.5px);
        }
        [data-theme="theme-nrega"] {
            --color-bg: #1a1f1b;
            --color-cardbg: rgba(255, 255, 255, 0.02);
            --color-cardborder: rgba(80, 251, 194, 0.1);
            --color-accent: #50fbc2;
            --text-main: #ffffff;
            --bg-pattern: none;
        }
        [data-theme="theme-midnight"] {
            --color-bg: #020617;
            --color-cardbg: rgba(59, 130, 246, 0.05);
            --color-cardborder: rgba(59, 130, 246, 0.1);
            --color-accent: #3b82f6; 
            --text-main: #ffffff;
            --bg-pattern: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
        [data-theme="theme-coffee"] {
            --color-bg: #291e18;
            --color-cardbg: rgba(255, 255, 255, 0.02);
            --color-cardborder: rgba(249, 115, 22, 0.1);
            --color-accent: #f97316;
            --text-main: #ffffff;
            --bg-pattern: none;
        }
        [data-theme="theme-purple"] {
            --color-bg: #1e1b4b;
            --color-cardbg: rgba(168, 85, 247, 0.05);
            --color-cardborder: rgba(168, 85, 247, 0.15);
            --color-accent: #a855f7; 
            --text-main: #ffffff;
            --bg-pattern: none;
        }
        [data-theme="theme-light-day"] {
            --color-bg: #f8fafc;
            --color-cardbg: #ffffff;
            --color-cardborder: #e2e8f0;
            --color-accent: #059669; 
            --text-main: #0f172a;
            --bg-pattern: radial-gradient(rgba(15, 23, 42, 0.06) 1.5px, transparent 1.5px);
        }
        [data-theme="theme-light-warm"] {
            --color-bg: #fffbeb;
            --color-cardbg: #ffffff;
            --color-cardborder: #fde68a;
            --color-accent: #d97706; 
            --text-main: #451a03;
            --bg-pattern: radial-gradient(rgba(69, 26, 3, 0.06) 1.5px, transparent 1.5px);
        }

        [data-theme*="light"] .text-white { color: var(--text-main) !important; }
        [data-theme*="light"] .text-slate-300 { color: #475569 !important; }
        [data-theme*="light"] .text-slate-400 { color: #64748b !important; }
        [data-theme*="light"] .bg-slate-800\/50 { background-color: rgba(0,0,0,0.05) !important; border-color: #cbd5e1 !important; color: var(--text-main) !important; }
        [data-theme*="light"] .glass-card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

        /* Smooth scrolling enable karein */
        html { scroll-behavior: smooth; }

        .glass-card {
            background-color: var(--color-cardbg);
            /* Blur intensity kam ki gayi hai aur hardware acceleration add kiya hai */
            backdrop-filter: blur(4px); 
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--color-cardborder);
            /* GPU rendering force karne ke liye */
            transform: translateZ(0);
            will-change: transform, opacity;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        body { 
            /* Transition background-color heavy ho sakta hai scroll pe, isliye ise static rakha gaya hai */
            background-image: var(--bg-pattern);
            background-size: 24px 24px;
            /* Scroll lag kam karne ke liye background ko fixed paint karein */
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-300 font-sans min-h-screen selection:bg-nregagreen selection:text-white">
    {% block content %}
    {% endblock %}
</body>
</html>
