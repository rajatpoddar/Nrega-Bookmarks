{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 h-screen flex items-center justify-center max-w-md">
    <div class="glass-card w-full rounded-2xl p-8 shadow-2xl border border-white/10 relative text-center">
        
        <div class="w-16 h-16 rounded-full bg-nregagreen/20 text-nregagreen flex items-center justify-center mx-auto mb-4 border border-nregagreen/30">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        
        <h2 class="text-2xl font-bold text-white mb-2">Admin Access</h2>
        <p class="text-slate-400 text-sm mb-6">Enter your secret PIN to access the dashboard</p>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2 rounded-lg text-sm mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <input type="password" name="pin" required placeholder="• • • • •" class="w-full bg-slate-800/50 border border-slate-600 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.5em] text-white focus:outline-none focus:border-nregagreen transition" autocomplete="off" autofocus>
            </div>
            
            <button type="submit" class="w-full bg-nregagreen hover:bg-emerald-600 text-white font-bold rounded-lg px-4 py-3 transition shadow-lg shadow-nregagreen/20">
                Unlock Panel
            </button>
        </form>

        <div class="mt-6">
            <a href="/" class="text-slate-500 hover:text-slate-300 text-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
